[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newsreader"
version = "0.1.0"
description = "Self-hosted news aggregator and reader (FastAPI + SQLite, static web client)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "yt-dlp>=2025.1.1",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
newsreader = "api.__main__:main"

[tool.hatch.build.targets.wheel]
only-include = ["api", "crawler", "models", "config.py", "fetcher.py", "web"]
